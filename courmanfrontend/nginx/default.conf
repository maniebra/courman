server {
    listen 3000;
    server_name _;

    # Uploads reach Django through Next's /api rewrite, so this hop needs the
    # same ceiling as the backend's nginx.
    client_max_body_size 50m;

    # Next bakes next.config rewrites into the build, so /api is proxied here
    # instead — that config's rewrite only serves host `pnpm dev`.
    location /api/ {
        proxy_pass http://backend-nginx:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
