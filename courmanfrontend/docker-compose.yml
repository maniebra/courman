services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api
      # Lets pnpm re-sync the node_modules volume non-interactively when the
      # lockfile changed since the image was built (otherwise it aborts: no TTY).
      CI: "true"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
