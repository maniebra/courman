services:
  frontend-nginx:
    image: nginx:1.29-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

  frontend:
    build: .
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
